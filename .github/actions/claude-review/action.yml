name: Claude Code Review
description: >
  Run Claude Code as a PR reviewer using a prompt assembled from
  prompts/*.md. prompts/base.md holds the main thread's process;
  prompts/shared.md, prompts/review-checks.md and the fixed Ruby/Rails
  and React toolset fragments under prompts/tools/ are appended to it
  and also staged in .pr-context/subagent-rules.md for the subagents.

inputs:
  claude_code_oauth_token:
    description: >
      Claude Code OAuth token. EMPTY on fork PRs (secrets are not
      exposed to fork-triggered workflows); the guard step skips the
      review cleanly in that case.
    required: true

runs:
  using: composite
  steps:
    - name: Decide whether to skip review
      id: guard
      shell: bash
      env:
        OAUTH: ${{ inputs.claude_code_oauth_token }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: |
        set -euo pipefail
        reason=""
        if [ -z "$OAUTH" ]; then
          # No token: either a fork PR (secrets withheld by GitHub) or
          # the CLAUDE_CODE_OAUTH_TOKEN secret is unset. Skip cleanly —
          # there is nothing to authenticate with, and this must not
          # fail-red on every external-contributor PR.
          reason="no Claude token (fork PR or unconfigured secret)"
        elif [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
          reason="PR authored by dependabot[bot]"
        fi
        if [ -n "$reason" ]; then
          echo "Skipping review: $reason"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Pre-fetch PR context
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ github.token }}
        DEST: ${{ github.workspace }}/.pr-context
      run: |
        set -euo pipefail
        mkdir -p "$DEST"
        gh pr view "$PR_NUMBER" \
          --repo "$REPO" \
          --json title,body,number,headRefOid,baseRefName,headRefName,additions,deletions,changedFiles,author,isDraft,labels,files \
          > "$DEST/meta.json"
        # --paginate writes each page as its own JSON array,
        # which is not valid JSON. Slurp pages and `add` to
        # merge them into one flat array.
        # Only repo members and the reviewer bot itself make it into the
        # model's context; drive-by comments from any GitHub account are
        # untrusted and dropped here.
        trusted='map(select((.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) or (.user.login | IN("github-actions[bot]", "claude[bot]"))))'
        gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --paginate \
          | jq -s "add // [] | $trusted" > "$DEST/inline-comments.json"
        gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
          | jq -s "add // [] | $trusted" > "$DEST/issue-comments.json"
        # checkout with fetch-depth: 0 already fetched all
        # history; the explicit fetch is a safety net for repos
        # configured with a different depth.
        git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
        # Three-dot diff: head vs. merge-base(base, head). Matches
        # GitHub's "Files changed" tab. Two-dot would fold in any
        # base-branch commits made after the PR branched off,
        # producing false positives on code the PR didn't touch.
        git diff "$BASE_SHA...$HEAD_SHA" > "$DEST/diff.patch"
        git diff --stat "$BASE_SHA...$HEAD_SHA" > "$DEST/diff-stat.txt"
        # Filtered code-only diff: excludes generated/lockfile noise
        # that bloats every subagent's cache_read without adding
        # review signal. Subagents default to this; full diff stays
        # at diff.patch for the rare case (e.g. correctness on a
        # schema change) where the excluded paths matter.
        #
        # The `glob` magic is mandatory for `**/...` patterns. In
        # default pathspec magic, `**` is two `*`s and matches at
        # least one path component, so `:(exclude)**/pnpm-lock.yaml`
        # silently fails on a root-level `pnpm-lock.yaml`. `:(exclude,glob)`
        # switches to gitignore-style globbing where `**/` collapses
        # to "any depth, including zero".
        git diff "$BASE_SHA...$HEAD_SHA" -- . \
          ':(exclude,glob)**/*.lock' \
          ':(exclude,glob)**/pnpm-lock.yaml' \
          ':(exclude,glob)**/package-lock.json' \
          ':(exclude,glob)**/db/structure.sql' \
          ':(exclude,glob)**/db/schema.rb' \
          ':(exclude,glob)**/app/assets/builds/**' \
          ':(exclude,glob)**/*.snap' \
          ':(exclude,glob)**/__snapshots__/**' \
          ':(exclude,glob)**/*.min.js' \
          ':(exclude,glob)**/*.min.css' \
          > "$DEST/diff-code.patch"
        printf '%s' "$BASE_SHA" > "$DEST/base-sha"
        printf '%s' "$HEAD_SHA" > "$DEST/head-sha"

    - name: Assemble prompt
      id: assemble
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RULES: ${{ github.workspace }}/.pr-context/subagent-rules.md
      run: |
        set -euo pipefail
        fragment() {
          envsubst '$PR_NUMBER $REPO $BASE_SHA $HEAD_SHA' < "$ACTION_PATH/prompts/$1"
          echo
        }
        # Subagents only see the prompt the main thread writes for
        # them, so everything they need is staged in one file that
        # each of them reads first. The main prompt gets the same
        # text plus the main-thread process in base.md.
        {
          if [ -s "$GITHUB_WORKSPACE/REVIEW.md" ]; then
            echo "# Repository review rules (inlined from REVIEW.md)"
            echo
            echo "These rules are the highest-priority review guidance and override the default checks below. Do not Read REVIEW.md from disk — this inlined copy is canonical."
            echo
            cat "$GITHUB_WORKSPACE/REVIEW.md"
            echo
            echo "---"
            echo
          fi
          fragment shared.md
          fragment review-checks.md
          # Fixed toolset for this repo: Ruby/Rails + React frontend.
          fragment tools/ruby.md
          fragment tools/frontend.md
        } > "$RULES"
        {
          echo "prompt<<PROMPT_EOF"
          fragment base.md
          cat "$RULES"
          echo "PROMPT_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Stage review helper
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DEST: ${{ github.workspace }}/.claude-review-post
      run: |
        set -euo pipefail
        cp "$ACTION_PATH/scripts/post-review.sh" "$DEST"
        chmod +x "$DEST"

    - name: Install subprocess isolation dependencies
      # claude-code-action only installs these itself when
      # allowed_non_write_users is set; CLAUDE_CODE_SUBPROCESS_ENV_SCRUB
      # hard-fails without bubblewrap.
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      run: |
        set -euo pipefail
        for i in 1 2 3; do
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
          echo "apt-get attempt $i failed, retrying..."
          sleep 5
        done
        command -v bwrap
        # Ubuntu 24.04+ restricts unprivileged user namespaces via AppArmor.
        if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

    - name: Prepare reviewer trace
      id: trace
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      run: |
        {
          echo "session_id=$(cat /proc/sys/kernel/random/uuid)"
          echo "artifact=claude-review-trace"
          echo "retention_days=7"
        } >> "$GITHUB_OUTPUT"

    - uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
      id: claude
      if: steps.guard.outputs.skip != 'true'
      env:
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        # Subagents start in the background by default since Claude Code
        # 2.1.3xx, and the action stops at the first result, so the review
        # ended before any check reported back.
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ github.token }}
        prompt: ${{ steps.assemble.outputs.prompt }}
        claude_args: |
          --model opus
          --session-id ${{ steps.trace.outputs.session_id }}
          --permission-mode default
          --allowedTools "Bash(gh pr comment:*),Bash(git ls-tree:*),Bash(./.claude-review-post:*),Task,Agent"
          --append-system-prompt "Repo-specific review rules are inlined in the review prompt under the 'Repository review rules' section, and staged for subagents in .pr-context/subagent-rules.md. Apply them in every subagent and validation pass — they override default rules. Findings that violate the inlined skip rules must not be reported. Do not Read REVIEW.md from disk; the inlined copy is canonical."

    - name: Collect reviewer trace
      id: collect_trace
      if: always() && steps.guard.outputs.skip != 'true'
      continue-on-error: true
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SESSION_ID: ${{ steps.trace.outputs.session_id }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        DEST: ${{ runner.temp }}/claude-review-trace
        REDACT_GITHUB_TOKEN: ${{ github.token }}
        REDACT_CLAUDE_TOKEN: ${{ inputs.claude_code_oauth_token }}
      run: '"$ACTION_PATH/scripts/collect-trace.sh" "$SESSION_ID" "$EXECUTION_FILE" "$DEST"'

    - name: Upload reviewer trace
      id: upload_trace
      if: always() && steps.collect_trace.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.trace.outputs.artifact }}
        path: ${{ runner.temp }}/claude-review-trace
        retention-days: ${{ steps.trace.outputs.retention_days }}
        if-no-files-found: ignore

    - name: Report denied tool calls
      # The list comes from the execution file, not from the model, so
      # denials inside subagents are reported too.
      if: always() && steps.guard.outputs.skip != 'true' && steps.claude.outputs.execution_file != ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        GITHUB_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TRACE_ARTIFACT: ${{ steps.upload_trace.outputs.artifact-id != '' && steps.trace.outputs.artifact || '' }}
        TRACE_RETENTION_DAYS: ${{ steps.trace.outputs.retention_days }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: node "$ACTION_PATH/scripts/review-result.mjs" report

    - name: Fail when the reviewer errored
      if: always() && steps.guard.outputs.skip != 'true' && steps.claude.outcome == 'success'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      run: node "$ACTION_PATH/scripts/review-result.mjs" check

    - name: Remove staged review helper
      if: always() && steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        DEST: ${{ github.workspace }}/.claude-review-post
      run: rm -f "$DEST"

    - name: Remove pre-fetched PR context
      if: always() && steps.guard.outputs.skip != 'true'
      shell: bash
      env:
        DEST: ${{ github.workspace }}/.pr-context
      run: rm -rf "$DEST"

    - name: Render reviewer transcript to step summary
      if: always() && steps.guard.outputs.skip != 'true' && steps.claude.outputs.execution_file != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
      run: |
        set -euo pipefail
        {
          echo "## Claude reviewer transcript"
          echo
          jq -r '
            (.[] | select(.type == "result")) as $r
            | "**Duration:** \(($r.duration_ms / 1000) | floor)s  ·  **Turns:** \($r.num_turns)  ·  **Cost:** $\($r.total_cost_usd)  ·  **Error:** \($r.is_error)"
          ' "$EXECUTION_FILE"
          echo
          echo "### Turns"
          echo
          jq -r '
            .[]
            | select(.type == "assistant")
            | .message.content[]?
            | if .type == "text" then
                "**assistant:**\n\n" + .text + "\n"
              elif .type == "tool_use" then
                "**tool_use** `" + .name + "`:\n\n```json\n" + (.input | tojson) + "\n```\n"
              else empty end
          ' "$EXECUTION_FILE"
          echo
          echo "### Final result"
          echo
          jq -r '(.[] | select(.type == "result")).result' "$EXECUTION_FILE"
        } >> "$GITHUB_STEP_SUMMARY"
