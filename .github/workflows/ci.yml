name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  rspec:
    env:
      RAILS_ENV: test
      PGUSER: test
      PGHOST: localhost
      PGPORT: 5432
      DATABASE_URL: postgres://test@localhost/fountainpencompanion_test
      OPEN_AI_TOKEN: test
      OPEN_AI_EMBEDDINGS: test
      OPEN_AI_PEN_AND_INK_SUGGESTION: test
      OPEN_AI_SPAM_CLASSIFIER: test
      GOOGLE_CREDENTIALS: "{}"
      GOOGLE_CLIENT_SECRETS: "{}"
      HCAPTCHA_SECRET: test
      HCAPTCHA_SITE_KEY: test
      SERPER_API_KEY: test

    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: test
          POSTGRES_DB: fountainpencompanion_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install correct Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "v24.14.0"
          cache: yarn
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Install JS dependencies
        run: yarn install
      - name: Run tests
        run: bundle exec rake
      - name: Report to CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: ruby
          token: ${{ secrets.CODECOV_TOKEN }}
  jest:
    runs-on: ubuntu-latest
    env:
      PRETTIER_RUBY_TIMEOUT_MS: 50000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install correct Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "v24.14.0"
          cache: yarn
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Install JS dependencies
        run: yarn install
      - name: Run lint
        run: yarn lint
      - name: Run tests
        run: yarn jest
      - name: Report to CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: javascript
          token: ${{ secrets.CODECOV_TOKEN }}
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          target: prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Deploy app
    needs: [rspec, jest, docker-build]
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    concurrency: deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.112
      - name: Stage Honeybadger revision secret
        run: flyctl secrets set HONEYBADGER_REVISION=${{ github.sha }} --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only --build-secret HONEYBADGER_API_KEY="$HONEYBADGER_API_KEY" --build-arg HONEYBADGER_REVISION=${{ github.sha }} --build-arg HONEYBADGER_ASSETS_URL=https://www.fountainpencompanion.com/assets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HONEYBADGER_API_KEY: ${{ secrets.FRONTEND_HONEYBADGER_API_KEY }}
      - name: Create New Relic deployment marker
        uses: newrelic/deployment-marker-action@d88a59ea8f713ad6935e60de27273157790b1e3b # v2.6.2
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          guid: NjMwNTQyOXxBUE18QVBQTElDQVRJT058NTg4OTg1Mzkw # FPC (account 6305429)
          region: US
          version: ${{ github.sha }}
          commit: ${{ github.sha }}
          deeplink: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          user: ${{ github.actor }}
      - name: Notify Honeybadger (backend)
        uses: honeybadger-io/github-notify-deploy-action@50838a23920642c5f587909e759f1e9e6db15a8a # v1.0.0
        with:
          api_key: ${{ secrets.HONEYBADGER_API_KEY }}
      - name: Notify Honeybadger (frontend)
        uses: honeybadger-io/github-notify-deploy-action@50838a23920642c5f587909e759f1e9e6db15a8a # v1.0.0
        with:
          api_key: ${{ secrets.FRONTEND_HONEYBADGER_API_KEY }}
